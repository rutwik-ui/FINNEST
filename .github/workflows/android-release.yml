name: Android release APK

# The Android app is a native Kotlin application. It cannot be hosted on Vercel —
# it is distributed as an APK (Firebase App Distribution / Google Play).
#
# This workflow builds a RELEASE-signed APK and publishes it as a downloadable
# artifact. You can also upload it to Firebase App Distribution for testers.
#
# One-time setup (see docs/android-release.md):
#   1. Create an upload keystore:  keytool -genkey -v -keystore release.keystore ...
#   2. In GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
#        ANDROID_KEYSTORE_BASE64   (base64 of the keystore file)
#        ANDROID_KEYSTORE_PASSWORD  (keystore password)
#        ANDROID_KEY_ALIAS         (key alias)
#        ANDROID_KEY_PASSWORD      (key password)
#   3. (Optional) Firebase App Distribution secrets:
#        FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT, FIREBASE_TOKEN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 0.5.0'
        required: true
        default: '0.5.0'

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect whether a release keystore is configured
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secrets found — building a DEBUG APK instead. Add the ANDROID_* secrets to publish signed builds."
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.mode == 'signed'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "keystore restored"

      - name: Build release APK
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee /tmp/finnest-release-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -100 /tmp/finnest-release-build.log | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error::$message"
          fi
          exit "$status"

      - name: Sign and align the release APK
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          test -f "$UNSIGNED" || { echo "unsigned APK not found at $UNSIGNED"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED"

      - name: Build debug APK fallback
        if: steps.signing.outputs.mode == 'debug'
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/finnest-debug-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -100 /tmp/finnest-debug-build.log | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error::$message"
          fi
          exit "$status"

      - name: Collect the APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk finnest-release.apk
            echo "file=finnest-release.apk" >> "$GITHUB_OUTPUT"
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk finnest-debug.apk
            echo "file=finnest-debug.apk" >> "$GITHUB_OUTPUT"
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          # `uses:` steps resolve paths from the repository root, not the
          # job's run working-directory, hence the android/ prefix here.
          name: FINNEST-android-${{ steps.collect.outputs.type }}
          path: android/${{ steps.collect.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Firebase App Distribution (optional)
        if: steps.collect.outputs.type == 'release' && env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
            npx --yes firebase-tools@latest appdistribution:distribute "${{ steps.collect.outputs.file }}" \
              --app "$FIREBASE_APP_ID" \
              --groups "testers" \
              --token "$FIREBASE_TOKEN" \
              --non-interactive \
              || echo "::warning::Firebase upload failed; the APK is still available as a workflow artifact."
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is empty — skipping Firebase upload."
          fi
