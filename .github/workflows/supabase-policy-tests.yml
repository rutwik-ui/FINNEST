name: Database policy tests
on:
  push:
    branches: ['main', 'arena/**']
    paths: ['supabase/**', '.github/workflows/supabase-policy-tests.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-policy-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: finnest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d finnest_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to disposable PostgreSQL and test RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: finnest_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00_disposable_supabase_shim.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          for test in supabase/tests/[1234]*.sql; do psql -v ON_ERROR_STOP=1 -f "$test"; done
