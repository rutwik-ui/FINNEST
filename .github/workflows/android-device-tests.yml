name: Android emulator tests
on:
  push:
    branches: ['main', 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-device-tests.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-device-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash -o pipefail -c 'cd android && ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 | tee /tmp/finnest-emulator-build.log'
      - name: Summarize instrumentation failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          failures = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
                  for case in root.iter('testcase'):
                      for error in list(case.findall('failure')) + list(case.findall('error')):
                          failures.append(f"{case.get('classname')}.{case.get('name')}: {error.get('message', '')}\n{error.text or ''}")
              except ET.ParseError:
                  pass
          message = ('\n'.join(failures) if failures else ''.join(open('/tmp/finnest-emulator-build.log').readlines()[-120:]) if __import__('os').path.exists('/tmp/finnest-emulator-build.log') else 'No emulator build log found.')[-3500:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{message}')
          PYCODE
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-report
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect journey screenshots
        if: always()
        run: |
          mkdir -p android/roadmap-screenshots
          adb pull /sdcard/Android/data/com.finnest.app/files/roadmap-screenshots/. android/roadmap-screenshots/ || true
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-journey-screenshots
          path: android/roadmap-screenshots/
          if-no-files-found: ignore
          retention-days: 14
