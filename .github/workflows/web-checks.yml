name: Website checks
on:
  push:
    branches: ['main', 'arena/**']
    paths: ['web-app/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['web-app/**', '.github/workflows/web-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
