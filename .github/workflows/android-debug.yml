name: Android debug APK

on:
  push:
    branches: ['main', 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and run JVM unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FINNEST-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
